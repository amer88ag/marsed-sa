 <path d="M112 216 256 357 400 216M160 162 256 357 352 162M210 121 256 357 302 121"/>
</g>
<!-- feed support and receiver -->
<path d="M256 350 256 177" stroke="url(#metal)" stroke-width="18" stroke-linecap="round"/>
<path d="M238 182 256 139 274 182Z" fill="#f6fbff" stroke="#9eb3c0" stroke-width="5"/>
