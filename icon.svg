<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b30"/><stop offset="1" stop-color="#174d76"/></linearGradient>
 <linearGradient id="dish" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#dce8f0"/><stop offset="1" stop-color="#91a9b9"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff7fc"/><stop offset="1" stop-color="#8099aa"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<circle cx="256" cy="228" r="196" fill="#38bdf8" opacity=".08"/>
<ellipse cx="258" cy="424" rx="145" ry="22" fill="#020d18" opacity=".3" filter="url(#shadow)"/>
<!-- dish reflector -->
<path d="M76 215 Q256 55 436 215 Q405 351 256 365 Q107 351 76 215Z" fill="#071522" opacity=".8" transform="translate(0 18)"/>
<path d="M76 215 Q256 55 436 215 Q405 351 256 365 Q107 351 76 215Z" fill="url(#dish)" stroke="#f8fcff" stroke-width="8"/>
<path d="M102 216 Q256 92 410 216" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/>
<path d="M96 223 Q256 337 416 223" fill="none" stroke="#829aaa" stroke-width="5" opacity=".7"/>
